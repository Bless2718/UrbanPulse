services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-urbanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanpulse_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanpulse} -d ${POSTGRES_DB:-urbanpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-urbanpulse}:${POSTGRES_PASSWORD:-urbanpulse_dev}@db:5432/${POSTGRES_DB:-urbanpulse}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-13.0827}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-80.2707}
      WEATHER_LOCATION_NAME: ${WEATHER_LOCATION_NAME:-Chennai}
      WEATHER_STATION_ID: ${WEATHER_STATION_ID:-open-meteo-chennai}
      IMD_STATION_ID: ${IMD_STATION_ID:-43279}
      IMD_CURRENT_WEATHER_URL: ${IMD_CURRENT_WEATHER_URL:-https://mausam.imd.gov.in/api/current_wx_api.php}
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
      DATA_GOV_ACCIDENT_RESOURCE_ID: ${DATA_GOV_ACCIDENT_RESOURCE_ID:-}
      DATA_GOV_PAGE_SIZE: ${DATA_GOV_PAGE_SIZE:-1000}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+pg8000://urbanpulse:urbanpulse_dev@db:5432/urbanpulse}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
