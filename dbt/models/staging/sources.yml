version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: weather_observations
      - name: accident_yearly_summary

models:
  - name: stg_weather_observations
    columns:
      - name: weather_observation_id
        tests: [not_null, unique]
      - name: station_id
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: humidity_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true

  - name: stg_accident_yearly
    columns:
      - name: accident_yearly_id
        tests: [not_null, unique]
      - name: year
        tests: [not_null, unique]
      - name: total_accidents
        tests: [not_null]
